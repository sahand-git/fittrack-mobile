name: Android install build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and check
        run: |
          npm ci
          npm run lint
          npm test
      - name: Bundle mobile frontend
        run: |
          npx vite build
          npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FitTrack.apk
          sha256sum FitTrack.apk > FitTrack.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FitTrack-Android
          path: |
            FitTrack.apk
            FitTrack.apk.sha256
      - name: Publish Android test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" FitTrack.apk FitTrack.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "FitTrack Android test build ${GITHUB_RUN_NUMBER}" \
            --notes-file .github/android-release.md
