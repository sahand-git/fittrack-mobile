name: Calorie Pewar preview APK

on:
  push:
    branches: [codex/calorie-pewar-release-candidate]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calorie-pewar-preview
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and verify source
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx cap sync android
      - name: Prepare isolated offline preview
        run: |
          node scripts/prepare-android-preview.mjs
          keytool -genkeypair -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Calorie Pewar Preview" -keyalg RSA -keysize 2048 -validity 365
      - name: Build and verify APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -5
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Calorie-Pewar-Preview.apk
          sha256sum Calorie-Pewar-Preview.apk > Calorie-Pewar-Preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Calorie-Pewar-Preview
          path: |
            Calorie-Pewar-Preview.apk
            Calorie-Pewar-Preview.apk.sha256
      - name: Publish test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "calorie-pewar-preview-${GITHUB_RUN_NUMBER}" Calorie-Pewar-Preview.apk Calorie-Pewar-Preview.apk.sha256 --target "$GITHUB_SHA" --prerelease --title "Calorie Pewar Android preview ${GITHUB_RUN_NUMBER}" --notes-file .github/calorie-pewar-preview.md
