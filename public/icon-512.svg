<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="24"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#emerald)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="200" transform="rotate(-90 256 256)"/>
  
  <!-- Barcode & Flame Symbol -->
  <g transform="translate(156, 156)">
    <!-- Barcode lines -->
    <rect x="20" y="40" width="12" height="120" rx="6" fill="#38bdf8"/>
    <rect x="44" y="40" width="6" height="120" rx="3" fill="#94a3b8"/>
    <rect x="62" y="40" width="18" height="120" rx="6" fill="#38bdf8"/>
    <rect x="92" y="40" width="8" height="120" rx="4" fill="#94a3b8"/>
    <rect x="112" y="40" width="16" height="120" rx="6" fill="#34d399"/>
    <rect x="140" y="40" width="8" height="120" rx="4" fill="#94a3b8"/>
    <rect x="160" y="40" width="20" height="120" rx="6" fill="#34d399"/>
    
    <!-- Laser line -->
    <line x1="0" y1="100" x2="200" y2="100" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Sparkle Leaf Indicator -->
  <circle cx="360" cy="150" r="32" fill="url(#amber)"/>
  <path d="M360 132 L364 144 L376 148 L364 152 L360 164 L356 152 L344 148 L356 144 Z" fill="#ffffff"/>
</svg>
