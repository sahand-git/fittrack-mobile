<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack privacy</title><style>body{max-width:44rem;margin:2rem auto;padding:1rem;font:16px/1.65 system-ui,Tahoma,sans-serif;background:#020617;color:#e2e8f0}a{color:#67e8f9}select{padding:.5rem;background:#0f172a;color:white;border:1px solid #475569;border-radius:.5rem}</style><body><select id="lang" aria-label="Language"><option value="en">English</option><option value="ckb">کوردیی سۆرانی</option><option value="ar">العربية</option></select><main id="content"></main><script>const data={"en":["FitTrack privacy notice","Accounts and backups","Email and password sign-up and Google sign-in use Firebase Authentication. Google shares a verified identity token and basic profile such as name, email address, and profile image when available. FitTrack never receives your Google password, does not read Gmail, and does not treat a Google or Gemini subscription as an API key.","Fitness records are saved on the device. A verified user may separately choose Back up now to upload a private copy of profile, daily logs, custom foods, and weight history to Firebase Cloud Firestore. Each account can read and replace only its own backup. Passwords and Gemini API keys are excluded. Backups are manual and are not continuous synchronization.","Before a cloud or file restore replaces device records, FitTrack saves a local recovery copy. The user can export JSON backups and the recovery copy. Opening or cancelling the share sheet does not prove a file was saved.","Health and barcode data","With separate permission, FitTrack reads step counts from Apple Health or Android Health Connect. It does not write health data, read in the background, or upload health permissions. Reading again replaces the selected day total.","Looking up an unknown barcode sends only that barcode to Open Food Facts over HTTPS. A returned product can be saved on the device. Food data is community-provided; compare it with the package label.","Optional Gemini AI","After a user enters a Google AI Studio API key and explicitly enables AI, an AI feature sends the displayed fitness context and request to the Google Gemini API. The key stays in memory for the session and is excluded from backups. Disconnecting or signing out clears it. AI nutrition values are estimates and are not medical advice.","Choices and control","People can use guest mode without an account, export or import their records, decline health and AI access, and sign out without deleting local fitness records. A signed-in user can permanently delete their login, private cloud backup, and account-specific local fitness records from Backup & Account. Guest records are kept separately.","This friends beta has no paid subscription. Contact the FitTrack owner for support or correction. Do not use the beta for medical diagnosis or emergencies."],"ar":["إشعار الخصوصية FitTrack","الحسابات والنسخ الاحتياطية","يستخدم تسجيل البريد الإلكتروني وكلمة المرور وتسجيل الدخول إلى Google مصادقة Firebase. تشارك Google رمز الهوية الذي تم التحقق منه والملف الشخصي الأساسي مثل الاسم وعنوان البريد الإلكتروني وصورة الملف الشخصي عندما يكون ذلك متاحًا. لا يتلقى FitTrack أبدًا كلمة مرور Google الخاصة بك، ولا يقرأ Gmail، ولا يتعامل مع اشتراك Google أو Gemini كمفتاح API.","يتم حفظ سجلات اللياقة البدنية على الجهاز. يمكن للمستخدم الذي تم التحقق منه اختيار النسخ الاحتياطي الآن بشكل منفصل لتحميل نسخة خاصة من الملف الشخصي والسجلات اليومية والأطعمة المخصصة وسجل الوزن إلى Firebase Cloud Firestore. يمكن لكل حساب قراءة واستبدال النسخة الاحتياطية الخاصة به فقط. يتم استبعاد كلمات المرور ومفاتيح Gemini API. النسخ الاحتياطية يدوية وليست مزامنة مستمرة.","قبل أن تحل عملية استعادة السحابة أو الملف محل سجلات الجهاز، يقوم FitTrack بحفظ نسخة استرداد محلية. يمكن للمستخدم تصدير نسخ JSON الاحتياطية ونسخة الاسترداد. لا يثبت فتح ورقة المشاركة أو إلغاؤها أنه تم حفظ الملف.","البيانات الصحية والباركود","وبإذن منفصل، يقرأ FitTrack عدد الخطوات من Apple Health أو Android Health Connect. ولا يكتب بيانات صحية، أو يقرأ في الخلفية، أو يحمّل أذونات صحية. القراءة مرة أخرى تحل محل إجمالي اليوم المحدد.","يؤدي البحث عن رمز شريطي غير معروف إلى إرسال هذا الرمز الشريطي فقط إلى Open Food Facts عبر HTTPS. يمكن حفظ المنتج المرتجع على الجهاز. البيانات الغذائية مقدمة من المجتمع؛ قارنه مع ملصق الحزمة.","الذكاء الاصطناعي الجوزاء الاختياري","بعد قيام المستخدم بإدخال مفتاح Google AI Studio API وتمكين الذكاء الاصطناعي بشكل صريح، ترسل ميزة الذكاء الاصطناعي سياق اللياقة المعروض وطلبًا إلى Google Gemini API. يبقى المفتاح في الذاكرة للجلسة ويتم استبعاده من النسخ الاحتياطية. يؤدي قطع الاتصال أو تسجيل الخروج إلى مسحه. إن قيم التغذية المعتمدة على الذكاء الاصطناعي هي تقديرات وليست نصيحة طبية.","الاختيارات والتحكم","يمكن للأشخاص استخدام وضع الضيف بدون حساب، وتصدير سجلاتهم أو استيرادها، ورفض الوصول إلى الصحة والذكاء الاصطناعي، وتسجيل الخروج دون حذف سجلات اللياقة البدنية المحلية. يمكن للمستخدم الذي قام بتسجيل الدخول حذف تسجيل الدخول والنسخ الاحتياطي السحابي الخاص وسجلات اللياقة المحلية الخاصة بالحساب بشكل دائم من النسخ الاحتياطي والحساب. يتم الاحتفاظ بسجلات الضيوف بشكل منفصل.","لا يحتوي الإصدار التجريبي من الأصدقاء هذا على اشتراك مدفوع. اتصل بمالك FitTrack للحصول على الدعم أو التصحيح. لا تستخدم الإصدار التجريبي للتشخيص الطبي أو حالات الطوارئ."],"ckb":["ئاگاداری نهێنی FitTrack","ئەکاونت و پاشەکەوت","چوونەژوورەوەی ئیمەیڵ و وشەی نهێنی و چوونەژوورەوەی گووگڵ لە Firebase Authentication بەکاردەهێنن. گووگڵ کاتێک بەردەستە، نیشانەیەکی ناسنامەی پشتڕاستکراوە و پڕۆفایلی بنەڕەتی وەک ناو، ناونیشانی ئیمەیڵ و وێنەی پڕۆفایلی هاوبەش دەکات. فیتتراک هەرگیز وشەی نهێنی گووگڵەکەت وەرناگرێت و جیمەیڵ ناخوێنێتەوە و بەشداریکردنی گووگڵ یان جێمینی وەک کلیلی API مامەڵەی لەگەڵ ناکات.","تۆمارەکانی لەشجوانی لەسەر ئامێرەکە هەڵدەگیرێن. بەکارهێنەرێکی پشتڕاستکراوە دەتوانێت بە جیا ئێستا پاشەکەوت بکە هەڵبژێرێت بۆ بارکردنی کۆپییەکی تایبەتی پڕۆفایلی، لۆگەکانی ڕۆژانە، خواردنە تایبەتەکان و مێژووی کێش بۆ Firebase Cloud Firestore. هەر ئەکاونتێک دەتوانێت تەنها پاشەکەوتی خۆی بخوێنێتەوە و بیگۆڕێت. وشەی نهێنی و کلیلی Gemini API بەدەر کراون. پاشەکەوتەکان دەستین و هاوکاتکردنی بەردەوام نین.","پێش ئەوەی گەڕاندنەوەی هەور یان پەڕگەیەک جێگەی تۆمارەکانی ئامێرەکە بگرێتەوە، FitTrack کۆپییەکی گەڕانەوەی ناوخۆیی هەڵدەگرێت. بەکارهێنەر دەتوانێت پاشەکەوتەکانی JSON و کۆپی گەڕانەوەکە هەناردە بکات. کردنەوەی یان هەڵوەشاندنەوەی لاپەڕەی پشکەکان ئەوە ناسەلمێنێت کە فایلێک پاشەکەوت کراوە.","زانیاری تەندروستی و بارکۆد","بە مۆڵەتی جیاواز، FitTrack ژمارەی هەنگاوەکان لە Apple Health یان Android Health Connect دەخوێنێتەوە. داتای تەندروستی نانووسێت و لە پاشبنەمادا ناخوێنێتەوە و مۆڵەتی تەندروستی بارناکات. دووبارە خوێندنەوە جێگەی کۆی گشتی ڕۆژە هەڵبژێردراوەکە دەگرێتەوە.","گەڕان بەدوای بارکۆدێکی نەناسراودا تەنها ئەو بارکۆدە دەنێرێت بۆ Open Food Facts لە ڕێگەی HTTPS. دەتوانرێت بەرهەمێکی گەڕاوە لەسەر ئامێرەکە پاشەکەوت بکرێت. داتاکانی خۆراک لەلایەن کۆمەڵگەوە دابین دەکرێن؛ بەراورد بکە لەگەڵ لیبێڵی پاکەتەکە.","ئیختیاری Gemini AI","دوای ئەوەی بەکارهێنەرێک کلیلی Google AI Studio API دەخاتە ناوەوە و بە ڕوونی AI چالاک دەکات، تایبەتمەندییەکی AI کۆنتێکستی لەشجوانی پیشان دراو و داواکارییەکە دەنێرێت بۆ Google Gemini API. کلیلەکە لە بیرگەدا دەمێنێتەوە بۆ دانیشتنەکە و لە پاشەکەوتەکان دوورخراوەتەوە. پچڕان یان دەرچوون پاکی دەکاتەوە. بەهاکانی خۆراکی AI خەمڵاندنن و ئامۆژگاری پزیشکی نین.","هەڵبژاردن و کۆنترۆڵکردن","خەڵک دەتوانن بەبێ ئەکاونت دۆخی میوان بەکاربهێنن، تۆمارەکانیان هەناردە یان هاوردە بکەن، دەستڕاگەیشتن بە تەندروستی و AI ڕەتبکەنەوە، و بەبێ سڕینەوەی تۆمارەکانی لەشجوانی ناوخۆیی دەربچن. بەکارهێنەرێکی چوونەژوورەوە دەتوانێت بۆ هەمیشە چوونەژوورەوەی خۆی، پاشەکەوتی هەوری تایبەت و تۆمارەکانی لەشجوانی ناوخۆیی تایبەت بە ئەکاونتەکەی لە Backup & Account بسڕێتەوە. تۆماری میوانەکان بە جیا دەهێڵرێتەوە.","ئەم بێتای هاوڕێیان هیچ بەشدارییەکی پارەیی نییە. بۆ پشتگیری یان ڕاستکردنەوە پەیوەندی بە خاوەنی FitTrack بکە. بێتا بۆ دەستنیشانکردنی پزیشکی یان حاڵەتی فریاگوزاری بەکارمەهێنە."]},tags=["h1","h2","p","p","p","h2","p","p","h2","p","h2","p","p"];let saved=localStorage.getItem('fittrack_language_v1'),lang=['en','ar','ckb'].includes(saved)?saved:(navigator.language.startsWith('ar')?'ar':navigator.language.startsWith('ckb')||navigator.language.startsWith('ku')?'ckb':'en');const select=document.getElementById('lang'),content=document.getElementById('content');function draw(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';select.value=lang;content.replaceChildren(...data[lang].map((text,i)=>{const el=document.createElement(tags[i]);el.textContent=text;return el}))}select.onchange=()=>{lang=select.value;localStorage.setItem('fittrack_language_v1',lang);draw()};draw();</script></body></html>
